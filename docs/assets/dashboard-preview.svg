<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">集社云电表助手 Dashboard 演示</title>
  <desc id="desc">展示余额、今日用电、近24小时、7日平均、用电趋势、最近记录和月度用电日历的演示界面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.card{fill:#fff;stroke:#e8ecf3;stroke-width:1}.label{font-size:15px;fill:#7a8498}.value{font-size:30px;font-weight:750;fill:#172033}.small{font-size:14px;fill:#7a8498}.section{font-size:18px;font-weight:700;fill:#172033}.muted{fill:#7a8498}.day{font-size:13px;fill:#334155}.tiny{font-size:12px;fill:#94a3b8}
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <g class="sans">
    <text x="80" y="68" font-size="30" font-weight="760" fill="#172033">⚡ 集社云电表助手</text>
    <text x="80" y="96" font-size="14" fill="#7a8498">远程抄读 · 用电趋势 · 月度统计 · Cloudflare D1</text>
    <rect x="1190" y="48" width="170" height="46" rx="12" fill="#2563eb"/>
    <text x="1275" y="77" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">刷新最新数据</text>
    <rect x="80" y="118" width="112" height="28" rx="14" fill="#eff6ff"/>
    <text x="136" y="137" text-anchor="middle" font-size="12" font-weight="650" fill="#2563eb">演示数据</text>

    <!-- stats row 1 -->
    <g filter="url(#shadow)">
      <rect class="card" x="80" y="170" width="300" height="128" rx="18"/>
      <rect class="card" x="400" y="170" width="300" height="128" rx="18"/>
      <rect class="card" x="720" y="170" width="300" height="128" rx="18"/>
      <rect class="card" x="1040" y="170" width="320" height="128" rx="18"/>
    </g>
    <text class="label" x="104" y="201">剩余余额</text><text class="value" x="104" y="245">¥ 86.42</text><text class="small" x="104" y="273">元</text>
    <text class="label" x="424" y="201">今日用电</text><text class="value" x="424" y="245">3.27</text><text class="small" x="424" y="273">kWh</text>
    <text class="label" x="744" y="201">近 24 小时</text><text class="value" x="744" y="245">8.64</text><text class="small" x="744" y="273">kWh</text>
    <text class="label" x="1064" y="201">7 日平均</text><text class="value" x="1064" y="245">7.91</text><text class="small" x="1064" y="273">kWh / 天</text>

    <!-- stats row 2 -->
    <g filter="url(#shadow)">
      <rect class="card" x="80" y="316" width="300" height="112" rx="18"/>
      <rect class="card" x="400" y="316" width="300" height="112" rx="18"/>
      <rect class="card" x="720" y="316" width="300" height="112" rx="18"/>
      <rect class="card" x="1040" y="316" width="320" height="112" rx="18"/>
    </g>
    <text class="label" x="104" y="347">累计用电</text><text x="104" y="389" font-size="25" font-weight="750" fill="#172033">126.38 kWh</text>
    <text class="label" x="424" y="347">今日估算电费</text><text x="424" y="389" font-size="25" font-weight="750" fill="#172033">¥ 2.08</text>
    <text class="label" x="744" y="347">估算单价</text><text x="744" y="389" font-size="25" font-weight="750" fill="#172033">¥ 0.636 / kWh</text>
    <text class="label" x="1064" y="347">电闸状态</text><circle cx="1073" cy="382" r="7" fill="#16a34a"/><text x="1091" y="389" font-size="25" font-weight="750" fill="#16a34a">正常</text>

    <!-- trend card -->
    <g filter="url(#shadow)"><rect class="card" x="80" y="448" width="848" height="312" rx="18"/></g>
    <text class="section" x="106" y="483">用电时间轴（最近 7 天）</text>
    <line x1="120" y1="700" x2="890" y2="700" stroke="#e8ecf3"/>
    <line x1="120" y1="640" x2="890" y2="640" stroke="#eef2f7"/>
    <line x1="120" y1="580" x2="890" y2="580" stroke="#eef2f7"/>
    <line x1="120" y1="520" x2="890" y2="520" stroke="#eef2f7"/>
    <path d="M120 688 C175 677 195 670 235 664 S310 638 355 646 S430 614 475 622 S545 584 595 598 S665 560 714 571 S795 538 840 548 S872 528 890 535 L890 700 L120 700 Z" fill="url(#area)"/>
    <path d="M120 688 C175 677 195 670 235 664 S310 638 355 646 S430 614 475 622 S545 584 595 598 S665 560 714 571 S795 538 840 548 S872 528 890 535" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <g fill="#2563eb"><circle cx="235" cy="664" r="5"/><circle cx="355" cy="646" r="5"/><circle cx="475" cy="622" r="5"/><circle cx="595" cy="598" r="5"/><circle cx="714" cy="571" r="5"/><circle cx="840" cy="548" r="5"/></g>
    <text class="tiny" x="120" y="727">09/04</text><text class="tiny" x="240" y="727">09/05</text><text class="tiny" x="360" y="727">09/06</text><text class="tiny" x="480" y="727">09/07</text><text class="tiny" x="600" y="727">09/08</text><text class="tiny" x="720" y="727">09/09</text><text class="tiny" x="840" y="727">09/10</text>

    <!-- recent records -->
    <g filter="url(#shadow)"><rect class="card" x="948" y="448" width="412" height="312" rx="18"/></g>
    <text class="section" x="974" y="483">最近记录</text>
    <g>
      <circle cx="984" cy="525" r="5" fill="#16a34a"/><text x="1001" y="521" font-size="14" font-weight="650" fill="#172033">09:40 · 126.38 kWh</text><text class="tiny" x="1001" y="541">余额 ¥86.42 · 抄读成功</text>
      <line x1="974" y1="560" x2="1334" y2="560" stroke="#eef2f7"/>
      <circle cx="984" cy="588" r="5" fill="#16a34a"/><text x="1001" y="584" font-size="14" font-weight="650" fill="#172033">09:35 · 126.34 kWh</text><text class="tiny" x="1001" y="604">余额 ¥86.45 · 自动采样</text>
      <line x1="974" y1="623" x2="1334" y2="623" stroke="#eef2f7"/>
      <circle cx="984" cy="651" r="5" fill="#16a34a"/><text x="1001" y="647" font-size="14" font-weight="650" fill="#172033">09:30 · 126.30 kWh</text><text class="tiny" x="1001" y="667">余额 ¥86.48 · 自动采样</text>
      <line x1="974" y1="686" x2="1334" y2="686" stroke="#eef2f7"/>
      <text class="tiny" x="974" y="721">Cloudflare Cron 每 5 分钟采样并写入 D1</text>
    </g>

    <!-- calendar teaser -->
    <g filter="url(#shadow)"><rect class="card" x="80" y="780" width="1280" height="88" rx="18"/></g>
    <text class="section" x="106" y="814">月度用电日历</text>
    <text class="muted" x="106" y="841" font-size="13">按天查看用电、费用与分时曲线 · 点击日期进入详情</text>
    <g transform="translate(690 800)">
      <rect x="0" y="0" width="74" height="45" rx="9" fill="#fbfcff" stroke="#e8ecf3"/><text class="day" x="12" y="18">6</text><text x="12" y="36" font-size="11" fill="#2563eb">7.8 kWh</text>
      <rect x="84" y="0" width="74" height="45" rx="9" fill="#fbfcff" stroke="#e8ecf3"/><text class="day" x="96" y="18">7</text><text x="96" y="36" font-size="11" fill="#2563eb">8.1 kWh</text>
      <rect x="168" y="0" width="74" height="45" rx="9" fill="#fbfcff" stroke="#e8ecf3"/><text class="day" x="180" y="18">8</text><text x="180" y="36" font-size="11" fill="#2563eb">7.4 kWh</text>
      <rect x="252" y="0" width="74" height="45" rx="9" fill="#fbfcff" stroke="#e8ecf3"/><text class="day" x="264" y="18">9</text><text x="264" y="36" font-size="11" fill="#2563eb">8.6 kWh</text>
      <rect x="336" y="0" width="74" height="45" rx="9" fill="#eff6ff" stroke="#2563eb"/><text class="day" x="348" y="18">10</text><text x="348" y="36" font-size="11" fill="#2563eb">3.3 kWh</text>
      <rect x="420" y="0" width="74" height="45" rx="9" fill="#fbfcff" stroke="#e8ecf3"/><text class="day" x="432" y="18">11</text><text x="432" y="36" font-size="11" fill="#94a3b8">--</text>
      <rect x="504" y="0" width="74" height="45" rx="9" fill="#fbfcff" stroke="#e8ecf3"/><text class="day" x="516" y="18">12</text><text x="516" y="36" font-size="11" fill="#94a3b8">--</text>
    </g>
  </g>
</svg>