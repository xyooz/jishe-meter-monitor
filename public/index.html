<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>集社云电表助手</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#7a8498;--line:#e8ecf3;--accent:#2563eb;--accent-soft:#eff6ff;--good:#16a34a;--warn:#d97706;--danger:#dc2626}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    body.modal-open{overflow:hidden}.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 56px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
    h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap}
    button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;transition:.18s ease}.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.primary{background:var(--accent);color:#fff;min-width:130px}
    button:disabled{cursor:not-allowed;opacity:.72}.primary:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(37,99,235,.2)}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}.spinner.dark{border-color:#dbeafe;border-top-color:var(--accent)}@keyframes spin{to{transform:rotate(360deg)}}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(15,23,42,.04)}
    .label{font-size:13px;color:var(--muted)}.value{font-size:27px;font-weight:750;margin-top:8px}.small{font-size:14px;color:var(--muted);margin-top:8px}.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.chart{height:340px}.timeline{max-height:340px;overflow:auto}
    .timeline-item{padding:12px 0;border-bottom:1px solid var(--line)}.timeline-time{font-size:12px;color:var(--muted)}.timeline-main{margin-top:4px;font-size:14px}.section-title{font-size:15px;font-weight:700;margin-bottom:8px}.status-good{color:var(--good)}.status-bad{color:var(--danger)}
    .notice{display:none;margin-bottom:14px;padding:11px 13px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
    .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);background:#172033;color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;box-shadow:0 10px 28px rgba(15,23,42,.2);opacity:0;pointer-events:none;transition:.22s ease;z-index:80}.toast.show{opacity:1;transform:translate(-50%,0)}
    .calendar-card{margin-top:14px}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.calendar-title{font-size:17px;font-weight:700}.calendar-summary{font-size:13px;color:var(--muted);margin-top:4px}.calendar-hint{font-size:12px;color:var(--muted);margin-top:4px}.calendar-nav{display:flex;align-items:center;gap:8px}.calendar-nav button{padding:7px 11px}.calendar-month{min-width:90px;text-align:center;font-weight:700}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.calendar-weekdays div{text-align:center;color:var(--muted);font-size:12px;padding:5px}
    .calendar-day{min-height:96px;border:1px solid var(--line);border-radius:11px;padding:9px;background:#fbfcff;transition:.16s ease}.calendar-day.empty{border:0;background:transparent}.calendar-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.calendar-day.clickable{cursor:pointer}.calendar-day.clickable:hover{border-color:#93c5fd;background:var(--accent-soft);transform:translateY(-1px)}.calendar-day.disabled{opacity:.48;background:#f8fafc;cursor:default}.day-number{font-weight:700;font-size:13px}.day-kwh{margin-top:12px;font-size:14px;font-weight:650}.day-cost{margin-top:4px;color:var(--muted);font-size:12px}.day-empty{margin-top:14px;color:#b0b7c5;font-size:12px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}.modal-backdrop.show{display:flex}.modal{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(15,23,42,.28)}
    .modal-head{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-title{font-size:20px;font-weight:760}.modal-sub{font-size:12px;color:var(--muted);margin-top:4px}.close-btn{width:36px;height:36px;padding:0;border-radius:50%;font-size:21px;background:#f3f4f6;color:#475569}.modal-body{padding:18px 20px 22px}.modal-loading{padding:54px 0;text-align:center;color:var(--muted)}
    .detail-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.detail-stat{border:1px solid var(--line);background:#fbfcff;border-radius:12px;padding:12px}.detail-stat .label{font-size:12px}.detail-stat .value{font-size:18px;margin-top:5px}.detail-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.detail-panel{border:1px solid var(--line);border-radius:14px;padding:14px}.detail-chart{height:270px}.records-panel{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.records-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}.records-wrap{max-height:280px;overflow:auto}.records-table{width:100%;border-collapse:collapse;font-size:12px}.records-table th,.records-table td{text-align:left;padding:9px 12px;border-bottom:1px solid #f0f2f6;white-space:nowrap}.records-table th{position:sticky;top:0;background:#fbfcff;color:var(--muted);font-weight:600}.empty-detail{text-align:center;color:var(--muted);padding:36px 12px}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.chart-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.chart{height:300px}.detail-grid{grid-template-columns:repeat(3,1fr)}.detail-charts{grid-template-columns:1fr}}
    @media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.value{font-size:22px}.card{padding:14px}.wrap{padding-top:16px}.calendar-weekdays,.calendar-grid{gap:3px}.calendar-day{min-height:77px;padding:6px}.day-kwh{margin-top:8px;font-size:11px}.day-cost,.day-empty{font-size:10px}.calendar-head{align-items:flex-start;flex-direction:column}.toast{width:calc(100% - 32px);text-align:center}.modal-backdrop{padding:0;align-items:flex-end}.modal{width:100%;max-height:94vh;border-radius:18px 18px 0 0}.modal-head{padding:15px 16px}.modal-body{padding:14px 14px 20px}.detail-grid{grid-template-columns:repeat(2,1fr)}.detail-chart{height:230px}.records-table th,.records-table td{padding:8px 9px}.calendar-hint{display:none}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>⚡ 集社云电表助手</h1><div class="sub" id="lastUpdate">正在加载...</div></div>
    <div class="actions"><button class="primary" id="refreshBtn">刷新最新数据</button></div>
  </div>
  <div class="notice" id="notice"></div>

  <div class="grid">
    <div class="card"><div class="label">剩余余额</div><div class="value" id="balance">--</div><div class="small">元</div></div>
    <div class="card"><div class="label">今日用电</div><div class="value" id="todayKwh">--</div><div class="small">kWh</div></div>
    <div class="card"><div class="label">近 24 小时</div><div class="value" id="last24h">--</div><div class="small">kWh</div></div>
    <div class="card"><div class="label">7 日平均</div><div class="value" id="avg7d">--</div><div class="small">kWh / 天</div></div>
  </div>

  <div class="grid" style="margin-top:14px">
    <div class="card"><div class="label">累计用电</div><div class="value" id="totalKwh">--</div><div class="small">kWh</div></div>
    <div class="card"><div class="label">今日估算电费</div><div class="value" id="todayCost">--</div><div class="small">元</div></div>
    <div class="card"><div class="label">估算单价</div><div class="value" id="unitPrice">--</div><div class="small">元 / kWh</div></div>
    <div class="card"><div class="label">电闸状态</div><div class="value" id="valve">--</div><div class="small" id="meterTime">最近抄读 --</div></div>
  </div>

  <div class="chart-grid">
    <div class="card"><div class="section-title">用电时间轴（最近 7 天）</div><div id="trendChart" class="chart"></div></div>
    <div class="card"><div class="section-title">最近记录</div><div id="timeline" class="timeline"></div></div>
  </div>

  <div class="card calendar-card">
    <div class="calendar-head">
      <div>
        <div class="calendar-title">月度用电日历</div>
        <div class="calendar-summary" id="calendarSummary">正在统计...</div>
        <div class="calendar-hint">点击有统计资格的日期，可查看当天曲线、分时用电和采样明细</div>
      </div>
      <div class="calendar-nav"><button class="ghost" id="prevMonth">‹</button><div class="calendar-month" id="calendarMonth">--</div><button class="ghost" id="nextMonth">›</button></div>
    </div>
    <div class="calendar-weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="dayModal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle">
    <div class="modal-head">
      <div><div class="modal-title" id="dayModalTitle">当日详情</div><div class="modal-sub" id="dayModalSub">正在加载...</div></div>
      <button class="close-btn" id="closeDayModal" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="dayModalBody">
      <div class="modal-loading"><span class="spinner dark"></span>正在加载当日统计...</div>
    </div>
  </div>
</div>

<script>
  const $=id=>document.getElementById(id);
  const chart=echarts.init($("trendChart"));
  let dayCumulativeChart=null,dayHourlyChart=null;
  let calendarCursor=new Date();calendarCursor.setDate(1);
  let lastKnownRead=null,toastTimer=null,loading=false,dataStartAt="2026-09-06 00:00:00";
  const fmt=(v,digits=2)=>Number.isFinite(Number(v))?Number(v).toFixed(digits):"--";
  const showNotice=msg=>{const el=$("notice");el.textContent=msg;el.style.display="block"};
  const hideNotice=()=>$("notice").style.display="none";
  const showToast=msg=>{const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2200)};
  const parseMeterTime=value=>value?new Date(value.replace(" ","T")+"+08:00"):null;
  const pad=n=>String(n).padStart(2,"0");
  function shanghaiTodayKey(){const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const get=t=>parts.find(p=>p.type===t)?.value||"00";return `${get("year")}-${get("month")}-${get("day")}`}
  function agoText(value){const d=parseMeterTime(value);if(!d||Number.isNaN(d.getTime()))return "";const min=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));if(min<1)return "刚刚抄读";if(min<60)return `${min} 分钟前抄读`;const h=Math.floor(min/60);return h<24?`${h} 小时前抄读`:`${Math.floor(h/24)} 天前抄读`}
  function setRefreshState(state){const b=$("refreshBtn");if(state==="loading"){b.disabled=true;b.innerHTML='<span class="spinner"></span>正在刷新...'}else if(state==="success"){b.disabled=true;b.textContent="✓ 已更新"}else{b.disabled=false;b.textContent="刷新最新数据"}}

  function renderHistory(history){
    const rows=[...history].sort((a,b)=>new Date(a.collected_at)-new Date(b.collected_at));
    const x=rows.map(r=>r.collected_at?new Date(r.collected_at).toLocaleString([],{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"--");
    const base=rows.length?Number(rows[0].kwh):0;const y=rows.map(r=>+(Number(r.kwh)-base).toFixed(3));
    chart.setOption({tooltip:{trigger:"axis"},grid:{left:48,right:18,top:25,bottom:48},xAxis:{type:"category",data:x,boundaryGap:false,axisLabel:{hideOverlap:true}},yAxis:{type:"value",name:"相对用电(kWh)"},series:[{type:"line",data:y,smooth:true,showSymbol:false,areaStyle:{opacity:.08}}]});
    $("timeline").innerHTML=rows.slice(-12).reverse().map(r=>`<div class="timeline-item"><div class="timeline-time">采集于 ${r.collected_at?new Date(r.collected_at).toLocaleString():"--"}</div><div class="timeline-main">${fmt(r.kwh,3)} kWh · 余额 ¥${fmt(r.balance,3)} · 电表抄读 ${r.read_time||"--"}</div></div>`).join("")||'<div class="small">正式统计将从 9 月 6 日 00:00 开始。</div>';
  }

  function render(data){
    const {status,summary,history}=data;if(data.dataStartAt)dataStartAt=data.dataStartAt;
    $("balance").textContent=`¥ ${fmt(status.balance,3)}`;$("todayKwh").textContent=fmt(summary.todayKwh,3);$("last24h").textContent=fmt(summary.last24hKwh,3);$("avg7d").textContent=fmt(summary.avgDailyKwh7d,3);$("totalKwh").textContent=fmt(status.kwh,3);$("todayCost").textContent=fmt(summary.todayCost,3);$("unitPrice").textContent=summary.pricePerKwh==null?"数据不足":fmt(summary.pricePerKwh,3);
    $("valve").textContent=status.valveState?"合闸":"断闸";$("valve").className=`value ${status.valveState?"status-good":"status-bad"}`;$("meterTime").textContent=`最近抄读 ${status.lastRead||"--"}`;
    const ago=agoText(status.lastRead);const start=dataStartAt?` · 统计自 ${dataStartAt.slice(5,16)}`:"";$("lastUpdate").textContent=`页面更新 ${new Date().toLocaleString()} · ${ago||`服务器记录 ${status.lastRead||"--"}`}${start}`;
    lastKnownRead=status.lastRead||null;renderHistory(history||[]);
  }

  const calendarKey=()=>`${calendarCursor.getFullYear()}-${pad(calendarCursor.getMonth()+1)}`;
  function renderCalendar(data){
    if(data.dataStartAt)dataStartAt=data.dataStartAt;
    const [year,month]=data.month.split("-").map(Number),byDay=new Map((data.days||[]).map(item=>[Number(item.day.slice(-2)),item]));
    const firstWeekday=new Date(year,month-1,1).getDay(),daysInMonth=new Date(year,month,0).getDate(),todayKey=shanghaiTodayKey(),startDate=dataStartAt.slice(0,10),cells=Array.from({length:firstWeekday},()=>'<div class="calendar-day empty"></div>');
    for(let day=1;day<=daysInMonth;day++){
      const date=`${year}-${pad(month)}-${pad(day)}`,item=byDay.get(day),isToday=date===todayKey,eligible=date>=startDate&&date<=todayKey;
      const cls=`calendar-day ${isToday?"today ":""}${eligible?"clickable":"disabled"}`;
      const body=item?`<div class="day-kwh">${fmt(item.kwh,3)} kWh</div><div class="day-cost">¥${fmt(item.cost,3)} · ${item.samples||0} 次</div>`:`<div class="day-empty">${eligible?"暂无数据":"未统计"}</div>`;
      cells.push(`<div class="${cls}" ${eligible?`data-date="${date}" title="查看 ${date} 当日详情"`:""}><div class="day-number">${day}</div>${body}</div>`);
    }
    $("calendarGrid").innerHTML=cells.join("");$("calendarMonth").textContent=`${year} 年 ${month} 月`;
    const totalKwh=(data.days||[]).reduce((s,i)=>s+Number(i.kwh||0),0),totalCost=(data.days||[]).reduce((s,i)=>s+Number(i.cost||0),0);$("calendarSummary").textContent=`本月 ${fmt(totalKwh,3)} kWh · 费用 ¥${fmt(totalCost,3)}`;
  }

  async function loadCalendar(){const r=await fetch(`/api/calendar?month=${calendarKey()}`,{cache:"no-store"});const j=await r.json();if(!j.ok)throw new Error(j.error||"日历加载失败");renderCalendar(j.data)}

  async function loadDashboard({manual=false}={}){
    if(loading&&manual)return;loading=true;hideNotice();const before=lastKnownRead;if(manual)setRefreshState("loading");
    try{
      const r=await fetch("/api/dashboard?days=7",{cache:"no-store"}),j=await r.json();if(!j.ok)throw new Error(j.error||"加载失败");render(j.data);loadCalendar().catch(e=>showNotice(e.message));
      if(manual){setRefreshState("success");showToast(before&&j.data.status.lastRead===before?`已刷新，仍是最近一次抄读（${j.data.status.lastRead||"--"}）`:`数据已更新 · ${j.data.status.lastRead||"--"}`);setTimeout(()=>setRefreshState("idle"),1300)}
    }catch(e){if(manual)setRefreshState("idle");throw e}finally{loading=false}
  }

  function dateTitle(date){const [y,m,d]=date.split("-");return `${y} 年 ${Number(m)} 月 ${Number(d)} 日`}
  function closeDayModal(){const modal=$("dayModal");modal.classList.remove("show");modal.setAttribute("aria-hidden","true");document.body.classList.remove("modal-open")}
  function showDayLoading(date){$("dayModalTitle").textContent=`${dateTitle(date)} · 当日详情`;$("dayModalSub").textContent="按约 5 分钟采样记录统计";$("dayModalBody").innerHTML='<div class="modal-loading"><span class="spinner dark"></span>正在加载当日统计...</div>';const modal=$("dayModal");modal.classList.add("show");modal.setAttribute("aria-hidden","false");document.body.classList.add("modal-open")}

  function renderDayDetails(data){
    const s=data.summary||{},records=data.records||[],hasData=records.length>0;
    $("dayModalTitle").textContent=`${dateTitle(data.date)} · 当日详情`;
    $("dayModalSub").textContent=hasData?`共 ${s.samples||0} 个正式采样点 · 统计起点 ${data.dataStartAt||dataStartAt}`:"当天暂无正式采样数据";
    if(!hasData){$("dayModalBody").innerHTML='<div class="empty-detail">当天暂无正式采样数据，稍后自动抄读后这里会出现详情。</div>';return}
    const peak=s.peakHour==null?"--":`${pad(s.peakHour)}:00`;
    $("dayModalBody").innerHTML=`
      <div class="detail-grid">
        <div class="detail-stat"><div class="label">当日用电</div><div class="value">${fmt(s.totalKwh,3)}</div><div class="small">kWh</div></div>
        <div class="detail-stat"><div class="label">当日费用</div><div class="value">¥ ${fmt(s.cost,3)}</div><div class="small">余额差额估算</div></div>
        <div class="detail-stat"><div class="label">采样点</div><div class="value">${s.samples||0}</div><div class="small">约 5 分钟 / 次</div></div>
        <div class="detail-stat"><div class="label">平均每小时</div><div class="value">${s.avgPerHour==null?"--":fmt(s.avgPerHour,3)}</div><div class="small">kWh / h</div></div>
        <div class="detail-stat"><div class="label">高峰小时</div><div class="value">${peak}</div><div class="small">分时增量最高</div></div>
        <div class="detail-stat"><div class="label">余额变化</div><div class="value">${fmt(s.startBalance,2)} → ${fmt(s.endBalance,2)}</div><div class="small">元</div></div>
      </div>
      <div class="detail-charts">
        <div class="detail-panel"><div class="section-title">当日累计用电曲线</div><div id="dayCumulativeChart" class="detail-chart"></div></div>
        <div class="detail-panel"><div class="section-title">分时用电增量</div><div id="dayHourlyChart" class="detail-chart"></div></div>
      </div>
      <div class="records-panel">
        <div class="records-head"><span>原始采样明细</span><span class="small">${records.length} 条</span></div>
        <div class="records-wrap"><table class="records-table"><thead><tr><th>抄读时间</th><th>累计电量</th><th>余额</th><th>电闸</th></tr></thead><tbody>${[...records].reverse().map(r=>`<tr><td>${r.read_time||"--"}</td><td>${fmt(r.kwh,3)} kWh</td><td>¥${fmt(r.balance,3)}</td><td>${Number(r.valve_state)?"合闸":"断闸"}</td></tr>`).join("")}</tbody></table></div>
      </div>`;

    dayCumulativeChart=echarts.init($("dayCumulativeChart"));dayHourlyChart=echarts.init($("dayHourlyChart"));
    const cumulative=data.cumulative||[],hours=data.hourly||[];
    dayCumulativeChart.setOption({tooltip:{trigger:"axis"},grid:{left:48,right:16,top:18,bottom:38},xAxis:{type:"category",data:cumulative.map(p=>(p.time||"").slice(11,16)),boundaryGap:false,axisLabel:{hideOverlap:true}},yAxis:{type:"value",name:"kWh"},series:[{type:"line",data:cumulative.map(p=>p.kwh),smooth:true,showSymbol:false,areaStyle:{opacity:.08}}]});
    dayHourlyChart.setOption({tooltip:{trigger:"axis",formatter:p=>`${p[0].axisValue}<br/>${fmt(p[0].value,3)} kWh`},grid:{left:48,right:16,top:18,bottom:38},xAxis:{type:"category",data:hours.map(h=>`${pad(h.hour)}时`),axisLabel:{interval:2}},yAxis:{type:"value",name:"kWh"},series:[{type:"bar",data:hours.map(h=>h.kwh),barMaxWidth:22}]});
  }

  async function openDay(date){
    showDayLoading(date);
    try{const r=await fetch(`/api/day?date=${encodeURIComponent(date)}`,{cache:"no-store"}),j=await r.json();if(!j.ok)throw new Error(j.error||"当日详情加载失败");renderDayDetails(j.data)}catch(e){$("dayModalBody").innerHTML=`<div class="empty-detail">${e.message}</div>`}
  }

  $("refreshBtn").addEventListener("click",()=>loadDashboard({manual:true}).catch(e=>showNotice(e.message)));
  $("prevMonth").addEventListener("click",()=>{calendarCursor.setMonth(calendarCursor.getMonth()-1);loadCalendar().catch(e=>showNotice(e.message))});
  $("nextMonth").addEventListener("click",()=>{calendarCursor.setMonth(calendarCursor.getMonth()+1);loadCalendar().catch(e=>showNotice(e.message))});
  $("calendarGrid").addEventListener("click",e=>{const cell=e.target.closest(".calendar-day[data-date]");if(cell)openDay(cell.dataset.date)});
  $("closeDayModal").addEventListener("click",closeDayModal);$("dayModal").addEventListener("click",e=>{if(e.target===$("dayModal"))closeDayModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDayModal()});
  window.addEventListener("resize",()=>{chart.resize();dayCumulativeChart?.resize();dayHourlyChart?.resize()});
  loadDashboard().catch(e=>showNotice(e.message));setInterval(()=>loadDashboard().catch(()=>{}),60*1000);
</script>
</body>
</html>
