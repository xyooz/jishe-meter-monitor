name: Jishe Meter Scheduled Read

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: jishe-meter-read
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read-and-query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read meter and query latest status
        env:
          JISHE_PHONE: ${{ secrets.JISHE_PHONE }}
          JISHE_CUSTOMER_ID: ${{ secrets.JISHE_CUSTOMER_ID }}
          JISHE_ROOM_ID: ${{ secrets.JISHE_ROOM_ID }}
          JISHE_METER_ID: ${{ secrets.JISHE_METER_ID }}
          JISHE_SIGN: ${{ secrets.JISHE_SIGN }}
        run: python jishe_meter.py read
