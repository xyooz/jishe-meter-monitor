name: Test Jishe Meter

on:
  workflow_dispatch:

jobs:
  read-and-query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read meter and query latest status
        env:
          JISHE_PHONE: ${{ secrets.JISHE_PHONE }}
          JISHE_CUSTOMER_ID: ${{ secrets.JISHE_CUSTOMER_ID }}
          JISHE_ROOM_ID: ${{ secrets.JISHE_ROOM_ID }}
          JISHE_METER_ID: ${{ secrets.JISHE_METER_ID }}
          JISHE_SIGN: ${{ secrets.JISHE_SIGN }}
        run: python jishe_meter.py read
