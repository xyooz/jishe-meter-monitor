name: Jishe Meter Manual Read

on:
  workflow_dispatch:

concurrency:
  group: jishe-meter-read
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read-and-query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read meter and capture latest status
        env:
          JISHE_PHONE: ${{ secrets.JISHE_PHONE }}
          JISHE_CUSTOMER_ID: ${{ secrets.JISHE_CUSTOMER_ID }}
          JISHE_ROOM_ID: ${{ secrets.JISHE_ROOM_ID }}
          JISHE_METER_ID: ${{ secrets.JISHE_METER_ID }}
          JISHE_SIGN: ${{ secrets.JISHE_SIGN }}
        run: |
          python jishe_meter.py read-json > meter_status.json
          python - <<'PY'
          import json
          with open("meter_status.json", encoding="utf-8") as f:
              s = json.load(f)
          print(f"抄读完成：{s['kwh']} kWh，余额 {s['balance']} 元，时间 {s['last_read']}")
          PY

      - name: Persist reading to Cloudflare D1
        env:
          DASHBOARD_BASE_URL: ${{ secrets.DASHBOARD_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlparse

          import requests

          base = os.getenv("DASHBOARD_BASE_URL", "").strip().rstrip("/")
          token = os.getenv("INGEST_TOKEN", "").strip()

          if not base or not token:
              print("::warning::未配置 DASHBOARD_BASE_URL 或 INGEST_TOKEN，本次仅完成抄表，不写入 D1。")
              raise SystemExit(0)

          parsed = urlparse(base)
          if parsed.scheme not in {"http", "https"} or not parsed.netloc:
              print("::error::DASHBOARD_BASE_URL 格式无效，请填写完整的 https://... 根地址。")
              raise SystemExit(1)

          with open("meter_status.json", encoding="utf-8") as f:
              payload = json.load(f)

          try:
              response = requests.post(
                  f"{base}/api/ingest",
                  json=payload,
                  headers={"Authorization": f"Bearer {token}"},
                  timeout=20,
              )
          except requests.RequestException as exc:
              print(f"::error::请求 Cloudflare ingest 失败：{type(exc).__name__}: {exc}")
              raise SystemExit(1)

          print(f"Cloudflare ingest HTTP {response.status_code}")
          if response.text:
              print(response.text[:2000])
          if not response.ok:
              raise SystemExit(1)

          result = response.json()
          if not result.get("ok"):
              print(f"::error::Cloudflare ingest 业务失败：{result}")
              raise SystemExit(1)

          print(f"D1 入库成功：inserted={result.get('inserted')}")
          PY
