name = "jishe-meter-monitor"
main = "src/entry.js"
compatibility_date = "2026-09-05"

[secrets]
required = ["JISHE_PHONE", "JISHE_CUSTOMER_ID", "JISHE_ROOM_ID", "JISHE_METER_ID", "JISHE_SIGN", "DASHBOARD_PASSWORD", "INGEST_TOKEN"]

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html"]

[[d1_databases]]
binding = "DB"
database_name = "jishe-meter-history"
database_id = "6c089bb0-41b6-48e1-bc4d-79e5d0f9fe3f"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
